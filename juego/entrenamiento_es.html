<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenamiento – Conexión Europa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050510;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #050510 70%);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
        }

        /* ── Barra superior ── */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .top-bar h1 {
            font-size: 1em;
            color: #a78bfa;
            white-space: nowrap;
        }
        .badge {
            background: rgba(96,165,250,0.14);
            border: 1px solid rgba(96,165,250,0.4);
            color: #93c5fd;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.82em;
            font-weight: 600;
            white-space: nowrap;
        }
        .spacer { flex: 1; min-width: 10px; }
        .speed-label { font-size: 0.82em; color: #94a3b8; white-space: nowrap; }
        select#speedSel {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: #e2e8f0;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85em;
            cursor: pointer;
        }
        select#speedSel option { background: #0f1535; }

        .btn {
            padding: 7px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88em;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
        .btn:active:not(:disabled) { transform: translateY(0); }
        .btn:disabled { opacity: 0.38; cursor: default; }
        .btn-green  { background: #22c55e; color: #fff; }
        .btn-yellow { background: #fbbf24; color: #1e1b1b; }
        .btn-red    { background: #ef4444; color: #fff; }
        .btn-ghost  { background: rgba(255,255,255,0.1); color: #e2e8f0; }

        /* ── Zona de imagen ── */
        .image-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cityImg {
            max-width: 70%;
            max-height: 70%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.45s ease;
            display: none;
            user-select: none;
        }

        /* Superposición con el nombre de la ciudad */
        .city-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9) 38%);
            padding: 70px 24px 22px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.45s ease;
            pointer-events: none;
            display: none;
        }
        .city-flag    { font-size: 3.2em; line-height: 1; margin-bottom: 6px; }
        .city-name    {
            font-size: clamp(2em, 7vh, 5em);
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 2px 16px rgba(0,0,0,0.95);
            line-height: 1.1;
        }
        .city-country {
            font-size: clamp(1em, 2.4vh, 1.5em);
            color: #c4b5fd;
            font-weight: 500;
            margin-top: 6px;
            text-shadow: 0 1px 8px rgba(0,0,0,0.9);
        }

        /* Pantalla de espera */
        .idle-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #050510 75%);
            gap: 14px;
            text-align: center;
            padding: 24px;
        }
        .idle-screen .big-icon { font-size: 5em; filter: drop-shadow(0 0 20px rgba(139,92,246,0.35)); }
        .idle-screen h2   {
            font-size: 1.8em;
            font-weight: 800;
            background: linear-gradient(100deg, #93c5fd 0%, #c4b5fd 50%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .idle-screen p    { color: #94a3b8; font-size: 0.95em; max-width: 460px; line-height: 1.6; }
        .idle-screen .keys {
            margin-top: 8px;
            font-size: 0.82em;
            color: #64748b;
        }
        .key {
            display: inline-block;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 5px;
            padding: 2px 8px;
            font-family: monospace;
            margin: 0 2px;
        }

        /* ── Barra de progreso del temporizador ── */
        .timer-bar {
            height: 5px;
            background: rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a78bfa);
            width: 0%;
        }

        @media (max-width: 640px) {
            .top-bar h1 { display: none; }
            .speed-label { display: none; }
            select#speedSel { font-size: 0.78em; padding: 5px 6px; }
            .btn { padding: 6px 10px; font-size: 0.82em; gap: 3px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<!-- ── Barra superior ── -->
<div class="top-bar">
    <h1>🎓 Entrenamiento – Conexión Europa</h1>
    <span class="badge" id="cityCounter">— / 16</span>
    <span class="badge" id="roundBadge">Ronda 1</span>
    <div class="spacer"></div>
    <label class="speed-label" for="speedSel">Velocidad:</label>
    <select id="speedSel" onchange="changeSpeed()">
        <option value="2000">Rápida (2 s)</option>
        <option value="3500" selected>Normale (3,5 s)</option>
        <option value="5000">Lenta (5 s)</option>
        <option value="8000">Muy lenta (8 s)</option>
    </select>
    <button class="btn btn-green"  id="btnStart" onclick="startOrResume()">▶ Iniciar</button>
    <button class="btn btn-yellow" id="btnPause" onclick="togglePause()" disabled>⏸ Pausa</button>
    <button class="btn btn-red"    id="btnStop"  onclick="stopTraining()"  disabled>⏹ Detener</button>
    <a href="entrenamiento_it.html" class="btn btn-ghost" title="Versione italiana">🇮🇹 IT</a>
    <a href="../index.html?lang=es" class="btn btn-ghost">☰ Menú</a>
</div>

<!-- ── Zona de imagen ── -->
<div class="image-area">

    <div class="idle-screen" id="idleScreen">
        <div class="big-icon">🌍</div>
        <h2>Entrenamiento — Conexión Europa</h2>
        <p>Repasa las 16 capitales europeas antes del juego. Aparecerán de forma aleatoria con el nombre y la bandera de cada país.</p>
        <p class="keys">
            Atajos: <span class="key">Espacio</span> Iniciar / Pausa &nbsp;
            <span class="key">→</span> Siguiente &nbsp;
            <span class="key">Esc</span> Detener
        </p>
    </div>

    <img id="cityImg" src="" alt="Ciudad europea">

    <div class="city-info" id="cityInfo">
        <div class="city-flag"    id="cityFlag"></div>
        <div class="city-name"    id="cityName"></div>
        <div class="city-country" id="cityCountry"></div>
    </div>

</div>

<!-- ── Barra de cuenta atrás ── -->
<div class="timer-bar">
    <div class="timer-fill" id="timerFill"></div>
</div>

<script>
const CITIES = {
    1:  { name: 'Madrid',    flag: '🇪🇸', country: 'España' },
    2:  { name: 'Roma',      flag: '🇮🇹', country: 'Italia' },
    3:  { name: 'París',    flag: '🇫🇷', country: 'Francia' },
    4:  { name: 'Atenas',     flag: '🇬🇷', country: 'Grecia' },
    5:  { name: 'Oslo',      flag: '🇳🇴', country: 'Noruega' },
    6:  { name: 'Lisboa',   flag: '🇵🇹', country: 'Portugal' },
    7:  { name: 'Londres',    flag: '🇬🇧', country: 'Reino Unido' },
    8:  { name: 'Dublín',   flag: '🇮🇪', country: 'Irlanda' },
    9:  { name: 'Berlín',   flag: '🇩🇪', country: 'Alemania' },
    10: { name: 'Varsovia',  flag: '🇵🇱', country: 'Polonia' },
    11: { name: 'Helsinki',  flag: '🇫🇮', country: 'Finlandia' },
    12: { name: 'Estocolmo', flag: '🇸🇪', country: 'Suecia' },
    13: { name: 'Reykjavík', flag: '🇮🇸', country: 'Islandia' },
    14: { name: 'Sofía',     flag: '🇧🇬', country: 'Bulgaria' },
    15: { name: 'Viena',    flag: '🇦🇹', country: 'Austria' },
    16: { name: 'Berna',     flag: '🇨🇭', country: 'Suiza' }
};
const IMG_BASE = '';
const FOLDERS  = ['img/ciudades/set1', 'img/ciudades/set2', 'img/ciudades/set3'];

let queue    = [];
let pos      = 0;
let round    = 1;
let timer    = null;
let paused   = false;
let running  = false;
let interval = 4000;

// ── Utilidades ──────────────────────────────────────────────────────────────
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function buildQueue() {
    return shuffle(Object.keys(CITIES).map(Number));
}

// ── Mostrar ciudad ────────────────────────────────────────────────────────────
function show(cityId) {
    const city   = CITIES[cityId];
    const folder = FOLDERS[Math.floor(Math.random() * FOLDERS.length)];
    const img    = document.getElementById('cityImg');
    const info   = document.getElementById('cityInfo');
    const newSrc = `${IMG_BASE}${folder}/imagen${cityId}.jpg`;

    img.style.opacity  = '0';
    info.style.opacity = '0';

    const waitFade = new Promise(res => setTimeout(res, 450));
    const waitLoad = new Promise(res => {
        const preload = new Image();
        preload.onload  = res;
        preload.onerror = res;
        preload.src = newSrc;
    });

    Promise.all([waitFade, waitLoad]).then(() => {
        img.src = newSrc;
        document.getElementById('cityFlag').textContent    = city.flag;
        document.getElementById('cityName').textContent    = city.name;
        document.getElementById('cityCountry').textContent = city.country;
        img.style.opacity  = '1';
        info.style.opacity = '1';
    });

    document.getElementById('cityCounter').textContent = `${pos + 1} / ${queue.length}`;
    document.getElementById('roundBadge').textContent  = `Ronda ${round}`;

    animateBar();
}

// ── Barra de progreso ─────────────────────────────────────────────────────────
function animateBar() {
    const fill = document.getElementById('timerFill');
    fill.style.transition = 'none';
    fill.style.width = '0%';
    fill.offsetWidth;
    fill.style.transition = `width ${interval}ms linear`;
    fill.style.width = '100%';
}

function freezeBar() {
    const fill   = document.getElementById('timerFill');
    const parent = fill.parentElement;
    const pct    = (fill.getBoundingClientRect().width / parent.getBoundingClientRect().width) * 100;
    fill.style.transition = 'none';
    fill.style.width = pct.toFixed(1) + '%';
}

function resetBar() {
    const fill = document.getElementById('timerFill');
    fill.style.transition = 'none';
    fill.style.width = '0%';
}

// ── Control del juego ─────────────────────────────────────────────────────────
function tick() {
    pos++;
    if (pos >= queue.length) {
        round++;
        pos = 0;
        queue = buildQueue();
    }
    show(queue[pos]);
}

function startOrResume() {
    if (running && paused) {
        paused = false;
        document.getElementById('btnPause').textContent = '⏸ Pausa';
        document.getElementById('btnStart').disabled    = true;
        document.getElementById('btnStart').textContent = '▶ Iniciar';
        timer = setInterval(tick, interval);
        animateBar();
        return;
    }

    round = 1; pos = 0;
    running = true; paused = false;
    queue = buildQueue();

    document.getElementById('idleScreen').style.display = 'none';
    document.getElementById('cityImg').style.display    = 'block';
    document.getElementById('cityInfo').style.display   = 'block';

    document.getElementById('btnStart').disabled  = true;
    document.getElementById('btnPause').disabled  = false;
    document.getElementById('btnStop').disabled   = false;
    document.getElementById('speedSel').disabled  = true;

    show(queue[pos]);
    timer = setInterval(tick, interval);
}

function togglePause() {
    if (!running) return;

    if (!paused) {
        paused = true;
        clearInterval(timer); timer = null;
        freezeBar();
        document.getElementById('btnPause').textContent = '▶ Reanudar';
        document.getElementById('btnStart').disabled    = false;
        document.getElementById('btnStart').textContent = '▶ Reanudar';
    } else {
        paused = false;
        document.getElementById('btnPause').textContent = '⏸ Pausa';
        document.getElementById('btnStart').disabled    = true;
        document.getElementById('btnStart').textContent = '▶ Iniciar';
        timer = setInterval(tick, interval);
        animateBar();
    }
}

function stopTraining() {
    running = false; paused = false;
    clearInterval(timer); timer = null;

    const img  = document.getElementById('cityImg');
    const info = document.getElementById('cityInfo');
    img.style.opacity  = '0';
    info.style.opacity = '0';
    resetBar();

    setTimeout(() => {
        img.style.display  = 'none';
        info.style.display = 'none';
        document.getElementById('idleScreen').style.display = 'flex';
    }, 460);

    document.getElementById('btnStart').disabled  = false;
    document.getElementById('btnStart').textContent = '▶ Iniciar';
    document.getElementById('btnPause').disabled  = true;
    document.getElementById('btnPause').textContent = '⏸ Pausa';
    document.getElementById('btnStop').disabled   = true;
    document.getElementById('speedSel').disabled  = false;
    document.getElementById('cityCounter').textContent = '— / 16';
    document.getElementById('roundBadge').textContent  = 'Ronda 1';
}

function skipNext() {
    if (!running || paused) return;
    clearInterval(timer);
    tick();
    timer = setInterval(tick, interval);
}

function changeSpeed() {
    interval = parseInt(document.getElementById('speedSel').value);
    if (running && !paused) {
        clearInterval(timer);
        timer = setInterval(tick, interval);
        animateBar();
    }
}

// ── Teclado ───────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.key === ' ') {
        e.preventDefault();
        if (!running) startOrResume();
        else          togglePause();
    }
    if (e.key === 'Escape')     stopTraining();
    if (e.key === 'ArrowRight') skipNext();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#08164a">
    <title>EUROPA - Control de Iluminación</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* ── Panel de control: misma paleta azul/oro de "Conexión Europa" ── */
        :root {
            --eu-950: #050d2e;
            --eu-900: #08164a;
            --eu-800: #0c2170;
            --eu-700: #123097;
            --eu-600: #1d44c4;
            --gold: #ffcc00;
            --gold-soft: #ffe066;
            --ink: #0d1a4d;
            --ink-dim: #5a6690;
            --line-soft: #e3e8f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--eu-900);
            background-image:
                radial-gradient(ellipse 80% 55% at 50% 0%, rgba(29, 68, 196, 0.85) 0%, transparent 70%),
                linear-gradient(180deg, var(--eu-800) 0%, var(--eu-950) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            padding: 20px 16px;
        }

        .container {
            position: relative;
            background: #fff;
            border-radius: 26px;
            padding: 34px 30px 26px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            color: var(--ink);
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-top: 56px;
            overflow: hidden;
        }

        /* Banda azul-oro superior */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--eu-700) 0%, var(--eu-600) 60%, var(--gold) 60%, var(--gold) 100%);
        }

        h1 { color: var(--eu-800); margin-bottom: 18px; font-size: 1.5em; font-weight: 800; }

        .data-box {
            background: radial-gradient(circle at 50% 0%, #fff7d1 0%, #fffdf5 60%);
            border-radius: 20px;
            padding: 22px 20px 18px;
            margin: 20px 0;
            border: 1px solid rgba(255, 204, 0, 0.45);
            box-shadow: inset 0 0 0 4px rgba(255, 204, 0, 0.08);
        }

        #valorLuz {
            font-size: 3.6em;
            font-weight: 800;
            line-height: 1.1;
            color: #e0a800;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 4px 18px rgba(255, 204, 0, 0.45);
        }

        .hint { color: var(--ink-dim); margin-top: 4px; }
        .hint-small { font-size: 0.82em; color: #8590b5; }

        .slider-wrapper {
            margin-top: 28px;
            padding: 20px 18px 16px;
            background: #f5f7fd;
            border: 1px solid var(--line-soft);
            border-radius: 20px;
        }

        input[type=range] {
            width: 100%;
            height: 14px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--eu-900) 0%, var(--eu-600) 50%, var(--gold) 100%);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            margin: 22px 0 18px;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid var(--eu-700);
            box-shadow: 0 4px 12px rgba(13, 26, 77, 0.35);
            cursor: pointer;
            transition: transform .2s, border-color .2s;
        }

        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.12); border-color: #c79e00; }

        input[type=range]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid var(--eu-700);
            box-shadow: 0 4px 12px rgba(13, 26, 77, 0.35);
            cursor: pointer;
        }

        input[type=range]:focus-visible { box-shadow: 0 0 0 4px rgba(29, 68, 196, 0.25); }

        .umbral-display {
            font-size: 1.25em;
            font-weight: 600;
            color: var(--eu-700);
        }

        #labelUmbral {
            display: inline-block;
            min-width: 3.5em;
            padding: 2px 12px;
            margin-left: 4px;
            border-radius: 999px;
            background: var(--eu-700);
            color: #fff;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .status {
            font-size: 0.85em;
            margin-top: 20px;
            padding: 10px 14px;
            border-radius: 12px;
            background: #f5f7fd;
            color: var(--ink-dim);
            line-height: 1.45;
        }

        /* Botón "⬅ Menú" */
        .btn-menu {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10001;
            padding: 8px 16px;
            background: rgba(5, 13, 46, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 204, 0, 0.5);
            border-radius: 999px;
            font: 600 14px 'Outfit', 'Segoe UI', sans-serif;
            text-decoration: none;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: background 0.2s ease;
        }
        .btn-menu:hover { background: rgba(18, 48, 151, 0.85); }

        @media (max-width: 480px) {
            .container { padding: 28px 18px 20px; border-radius: 22px; }
            #valorLuz { font-size: 3em; }
        }
    </style>
</head>
<body>
    <a href="../index.html?lang=es" class="btn-menu">⬅ Menú</a>

    <div class="container">
        <h1>💡 Nivel de Luz Ambiente</h1>
        
        <div class="data-box">
            <div id="valorLuz">0</div>
            <p class="hint">Valor actual del sensor</p>
        </div>

        <div class="slider-wrapper">
            <p class="umbral-display">Ajustar Umbral: <span id="labelUmbral">4000</span></p>
            <input type="range" id="sliderUmbral" min="0" max="10000" step="50" value="4000">
            <p class="hint-small">Desliza para cambiar el límite de activación</p>
        </div>

        <div id="status" class="status">Conectando al broker MQTT...</div>
    </div>

    <script>
        // CONFIGURACIÓN
        const prefix = 'sanjealcantarilla/';
        const TOPIC_LUZ = prefix + 'luzambiente';
        const TOPIC_UMBRAL = prefix + 'umbral';

        // Conexión al broker público
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        const valorLuzDiv = document.getElementById('valorLuz');
        const slider = document.getElementById('sliderUmbral');
        const labelUmbral = document.getElementById('labelUmbral');
        const statusDiv = document.getElementById('status');

        client.on('connect', () => {
            statusDiv.innerHTML = "🟢 Conectado exitosamente<br><small>Suscrito a: " + prefix + "#</small>";
            
            // SUSCRIPCIÓN A AMBOS TÓPICOS
            client.subscribe([TOPIC_LUZ, TOPIC_UMBRAL], (err) => {
                if (!err) {
                    console.log("Suscrito a luz y umbral");
                }
            });
        });

        client.on('message', (topic, message) => {
            const payload = message.toString();
            
            // Lógica según el tópico que llega
            if (topic === TOPIC_LUZ) {
                valorLuzDiv.innerText = payload;
            } 
            else if (topic === TOPIC_UMBRAL) {
                // Si el umbral cambia (desde esta web o desde fuera), actualizamos la UI
                slider.value = payload;
                labelUmbral.innerText = payload;
                console.log("Umbral sincronizado:", payload);
            }
        });

        // Actualizar etiqueta visual mientras se arrastra (solo local)
        slider.oninput = function() {
            labelUmbral.innerText = this.value;
        };

        // Enviar por MQTT solo al soltar el ratón
        slider.onchange = function() {
            const val = this.value;
            client.publish(TOPIC_UMBRAL, val, { retain: true });
            console.log("Publicando nuevo umbral:", val);
        };

        client.on('error', (err) => {
            statusDiv.innerHTML = "🔴 Error de conexión";
            console.error(err);
        });

        client.on('offline', () => {
            statusDiv.innerHTML = "🟠 El cliente está offline";
        });
    </script>
</body>
</html>

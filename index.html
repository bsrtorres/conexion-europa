<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexión Europa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .logo {
            max-width: 140px;
            max-height: 100px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(2em, 6vw, 3.2em);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 6px;
            text-align: center;
        }

        .subtitle {
            font-weight: 300;
            opacity: 0.9;
            margin-bottom: 40px;
            text-align: center;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 36px 24px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            color: white;
            font: inherit;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover,
        .card:focus-visible {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.22);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.25);
            outline: none;
        }

        .card .icon {
            font-size: 3.5em;
            line-height: 1;
        }

        .card h2 {
            font-size: 1.5em;
        }

        .card p {
            font-size: 0.95em;
            opacity: 0.85;
        }

        footer {
            margin-top: 40px;
            font-size: 0.85em;
            opacity: 0.7;
        }

        footer button {
            background: none;
            border: none;
            color: inherit;
            font: inherit;
            text-decoration: underline;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        /* ── QR para entrar desde el móvil ── */
        .qr-zona {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .qr {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .qr img {
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 10px;
            padding: 6px;
        }

        .qr p {
            font-size: 1.1em;
            line-height: 1.5;
        }

        /* En el móvil ya están dentro: no hace falta el QR */
        @media (max-width: 700px) {
            .qr-zona { display: none; }
        }
    </style>
</head>
<body>
    <img src="juego/img/logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">

    <!-- ── Paso 1: idioma ── -->
    <section id="pasoIdioma">
        <h1>Conexión Europa</h1>
        <p class="subtitle">Elige idioma · Scegli la lingua</p>
        <nav class="menu">
            <button class="card" lang="es" onclick="elegirIdioma('es')">
                <span class="icon">🇪🇸</span>
                <h2>Español</h2>
            </button>
            <button class="card" lang="it" onclick="elegirIdioma('it')">
                <span class="icon">🇮🇹</span>
                <h2>Italiano</h2>
            </button>
        </nav>
        <footer style="text-align:center">Feria · Fiera 2026</footer>
    </section>

    <!-- ── Paso 2: opciones ── -->
    <section id="pasoMenu" class="hidden">
        <h1 id="titulo"></h1>
        <p class="subtitle" id="subtitulo"></p>
        <nav class="menu" id="opciones"></nav>
        <footer style="text-align:center"><button onclick="volverIdioma()" id="cambiarIdioma"></button></footer>
    </section>

    <!-- ── QR al entrenamiento de cada idioma (para entrenar desde el móvil) ── -->
    <div class="qr-zona">
        <div class="qr" lang="es">
            <img src="juego/img/qr_entrenamiento_es.png" alt="QR del entrenamiento en español">
            <p>🇪🇸 <strong>Español</strong><br>📱 Escanea y entrena<br>desde tu móvil</p>
        </div>
        <div class="qr" lang="it">
            <img src="juego/img/qr_entrenamiento_it.png" alt="QR dell'allenamento in italiano">
            <p>🇮🇹 <strong>Italiano</strong><br>📱 Scansiona e allenati<br>dal cellulare</p>
        </div>
    </div>

    <script>
        const TEXTOS = {
            es: {
                titulo: 'Conexión Europa',
                subtitulo: 'Selecciona una opción',
                cambiar: '🌐 Cambiar idioma · Cambia lingua',
                opciones: [
                    { icon: '🎓', nombre: 'Entrenamiento',    desc: 'Repasa las capitales',    href: 'juego/entrenamiento_es.html' },
                    { icon: '🕵️', nombre: 'Espía',            desc: 'Operación Europa 2026',   href: 'juego/espia_es.html' },
                    { icon: '🎛️', nombre: 'Control',          desc: 'Control de iluminación',  href: 'juego/control_es.html' },
                    { icon: '🌍', nombre: 'Conexión Europa', desc: 'Descubre Europa',         href: 'juego/conexion_es.html' }
                ]
            },
            it: {
                titulo: 'Connessione Europa',
                subtitulo: "Seleziona un'opzione",
                cambiar: '🌐 Cambia lingua · Cambiar idioma',
                opciones: [
                    { icon: '🎓', nombre: 'Allenamento',         desc: 'Ripassa le capitali',          href: 'juego/entrenamiento_it.html' },
                    { icon: '🕵️', nombre: 'Spia',                desc: 'Operazione Europa 2026',       href: 'juego/espia_it.html' },
                    { icon: '🎛️', nombre: 'Controllo',           desc: "Controllo dell'illuminazione", href: 'juego/control_it.html' },
                    { icon: '🌍', nombre: 'Connessione Europa', desc: "Scopri l'Europa",              href: 'juego/conexion_it.html' }
                ]
            }
        };

        function elegirIdioma(lang) {
            const t = TEXTOS[lang];
            document.documentElement.lang = lang;
            document.getElementById('titulo').textContent = t.titulo;
            document.getElementById('subtitulo').textContent = t.subtitulo;
            document.getElementById('cambiarIdioma').textContent = t.cambiar;
            document.getElementById('opciones').innerHTML = t.opciones.map(o => `
                <a class="card" href="${o.href}">
                    <span class="icon">${o.icon}</span>
                    <h2>${o.nombre}</h2>
                    <p>${o.desc}</p>
                </a>`).join('');
            document.getElementById('pasoIdioma').classList.add('hidden');
            document.getElementById('pasoMenu').classList.remove('hidden');
            try { history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
        }

        function volverIdioma() {
            document.getElementById('pasoMenu').classList.add('hidden');
            document.getElementById('pasoIdioma').classList.remove('hidden');
            try { history.replaceState(null, '', location.pathname); } catch (e) {}
        }

        // Las páginas del juego vuelven aquí con ?lang=es / ?lang=it
        const langInicial = new URLSearchParams(location.search).get('lang');
        if (TEXTOS[langInicial]) elegirIdioma(langInicial);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexión Europa – Entrenamiento</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .logo {
            max-width: 120px;
            max-height: 90px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(1.8em, 6vw, 3em);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 6px;
            text-align: center;
        }

        .subtitle {
            font-weight: 300;
            opacity: 0.9;
            margin-bottom: 36px;
            text-align: center;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 32px 20px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            color: white;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .card:hover,
        .card:focus-visible {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.22);
            outline: none;
        }

        .card .icon { font-size: 3.2em; line-height: 1; }
        .card h2    { font-size: 1.4em; }
        .card p     { font-size: 0.95em; opacity: 0.85; }

        footer {
            margin-top: 36px;
            font-size: 0.85em;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <img src="img/logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
    <h1>Conexión Europa</h1>
    <p class="subtitle">🎓 Entrenamiento · Allenamento</p>

    <nav class="menu">
        <a class="card" href="entrenamiento_es.html" lang="es">
            <span class="icon">🇪🇸</span>
            <h2>Español</h2>
            <p>Repasa las capitales</p>
        </a>
        <a class="card" href="entrenamiento_it.html" lang="it">
            <span class="icon">🇮🇹</span>
            <h2>Italiano</h2>
            <p>Ripassa le capitali</p>
        </a>
    </nav>

    <footer>Feria · Fiera 2026</footer>
</body>
</html>
